nc: 2
names:
  0: nonpollenbee
  1: pollenbee

min_lr: 0.000100000000
max_lr: 0.010000000000
momentum: 0.9370000000
weight_decay: 0.000500
warmup_epochs: 3.00000

box: 7.500000000000000
cls: 0.500000000000000
dfl: 1.500000000000000

# Box regression loss: ciou | saf_siou
# abl_full (row 9): SAF-SIoU ON (with VFL-w already on) — full-model loss stack
box_loss_type: saf_siou
saf_theta: 4          # Omega exponent in the SIoU shape cost
saf_C: 12.8           # NWD scale, input-scale pixels
saf_T: 32.0           # size-gate threshold, input-scale pixels
saf_alpha_f: 1.9      # WIoU-v3 focusing base
saf_delta: 3.0        # WIoU-v3 focusing delta
saf_momentum: 0.999   # running-mean momentum for L_reg

# abl_vflw (row 4): weighted Varifocal loss ON — cls_loss_type vfl +
# cls_pos_weight [1.0, 2.0] (pollenbee minority class weighted 2x, §2)
cls_loss_type: vfl
vfl_alpha: 0.75
vfl_gamma: 2.0
vfl_iou_weighted: true
cls_pos_weight:
  - 1.0
  - 2.0

# Class-balanced weighting via effective number of samples (Cui et al. 2019).
# Opt-in, default off. When on, per-class weights are computed from the train-set
# GT counts (injected by the pipeline) and OVERRIDE cls_pos_weight above.
cls_effective_number: false
cls_effective_number_beta: 0.999
# Optionally scale each instance's SAF-SIoU L_reg by its assigned class weight
# (reuses the same weights; requires box_loss_type: saf_siou). Default off.
box_class_coupling: false

# Augmentation (train split only). Scale-preserving transforms ONLY —
# HSV jitter + flips. Mosaic/affine deliberately off so object-size
# statistics stay matched to evaluation; the loader ignores the zeroed keys.
hsv_h: 0.0150000000000
hsv_s: 0.7000000000000
hsv_v: 0.4000000000000
degrees: 0.00000000000
translate: 0.000000000
scale: 0.0000000000000
shear: 0.0000000000000
flip_ud: 0.00000000000
flip_lr: 0.50000000000
mosaic: 0.000000000000
mix_up: 0.000000000000
